# A workspace rooted in the server (.agents/docs/design.md §2).
#
# Split by DEPENDENCY SET, not by taste: mcpp compiles a package's modules once and links them into
# every executable of that package, so anything a tool needs and the server must not carry (a
# network client, an archive reader) lives in a member the server does not depend on.
#
#   modules/base, modules/platform   shared by the server, the tools and the gateway
#   modules/pack                     packaging only: tinyhttps, libarchive
#   tools/devtools                   mcppls-devtools, the one entry for project work (docs/93-devtools.md)
#   tools/model-gateway              mcppls-model
#
# The root package stays the server, so `mcpp build` and `mcpp test` mean what they meant; a
# member is reached with `-p` (`mcpp run -p devtools -- payload`), and `--workspace` reaches all.
[workspace]
members = [
    "modules/base",
    "modules/platform",
    "modules/pack",
    "tools/devtools",
    "tools/model-gateway",
]

# One version of each third-party package for every member.
[workspace.dependencies]
openkal-llvm-runtime = "0.15.2"
cmdline              = "0.0.2"
tinyhttps            = "0.3.1"

[workspace.dependencies.nlohmann]
json = "3.12.0"

[workspace.dependencies.compat]
libarchive = "3.8.7"

[package]
name        = "mcpp-language-server"
version     = "0.0.6"
description = "Compiler-agnostic C++ modules language server"
license     = "Apache-2.0"
authors     = ["Sunrisepeak"]
repo        = "https://github.com/Sunrisepeak/mcpp-language-server"

[build]
sources = ["src/**/*.cppm", "src/**/*.cpp"]
# The server imports three libSystem symbols, all of them macOS 10.12+; clangd in the payload is
# built for 11.0. Honoured when cross-compiling from Linux since mcpp 2026.9.24.1 (mcpp#685).
macos_deployment_target = "11.0"

# A plugin library binds to the names this program offers (MC4 §3): on Linux the programs are
# position-independent and static, their names exported -- less Clang's and LLVM's, by libmc++'s
# src/exports.map, which build.mcpp passes -- and they relocate themselves when they start.
[target.'cfg(os = "linux")'.build]
ldflags = ["-Wl,-pie", "-Wl,-z,pack-relative-relocs", "-Wl,--export-dynamic"]

# Every executable shares every module under src/.
[targets.mcppls]
kind = "bin"
main = "src/main.cpp"

[targets.mcppls-conformance]
kind = "bin"
main = "src/bin/conformance.cpp"

[targets.mcppls-lspgen]
kind = "bin"
main = "src/bin/lspgen.cpp"

# Stands in for mcpp in conformance fixtures: the build-database contract of mcpp-community/mcpp#636.
[targets.mcppls-mock-mcpp]
kind = "bin"
main = "src/bin/mockmcpp.cpp"

# Stands in for the mcppls-model gateway in tests: tools/model-gateway/PROTOCOL.md over stdin/stdout.
[targets.mcppls-mock-model]
kind = "bin"
main = "src/bin/mockmodel.cpp"

[toolchain]
default = "llvm@22.1.8"

# libmc++'s own indices (mcpp-safe/index, its rule R2): llvm.clang-dev, which mcxx.clang depends on, and
# microsoft.ifc-sdk, which mcxx.ifc (MC2) does. Only a workspace root's [indices] is read, so the
# consumer states them.
[indices]
llvm = { path = "../../index/llvm" }
microsoft = { path = "../../index/microsoft" }

# The platform: openkal beneath musl, libc++ above it. One source builds every target.
[dependencies]
openkal-llvm-runtime.workspace = true
# The C library, from speak-agent's fork, as libmc++'s own root names it: dlopen in a static program,
# for MC4's plugin libraries (`library = "..."`), which the editor loads as a compile does.
openkal-musl                   = { git = "https://github.com/speak-agent/openkal-musl.git", tag = "0.19.6" }
cmdline.workspace              = true
mcppls-base                    = { path = "modules/base" }
mcppls-platform                = { path = "modules/platform" }
# libmc++ (MC++, Sunrisepeak/mcpp-safe): the mcxx engine in process -- MSA, its LSP service and the
# backend facade; which front end answers is libmc++'s business.
# During development this fork lives in mcpp-safe/forks/; the MC++ local index later.
mcxx-msa                       = { path = "../../modules/msa" }
mcxx-backend                   = { path = "../../modules/backend/semantic" }
# MC++'s plugins, linked in: the editor shows the same feature gates and [[mcpp::cfg]] a compile by
# mcxx applies (A1.4.2).
mcxx-plugins-std               = { path = "../../plugins/std" }
mcxx-plugins-libs              = { path = "../../plugins/libs" }
mcxx-lsp                       = { path = "../../modules/lsp" }
# MC++'s own front end (M1.8, E-LS-3): the native engine's lexing, outline and workspace symbols.
mcxx-frontend                  = { path = "../../modules/frontend" }

[dependencies.nlohmann]
json.workspace = true

[dev-dependencies]
mcppls-testing = { path = "modules/testing" }

# Platform facts are a package chosen by the target, consumed with `if constexpr`.
[target.'cfg(os = "linux")'.dependencies]
mcppls-os-linux = { path = "modules/os/linux" }

[target.'cfg(os = "macos")'.dependencies]
mcppls-os-macos = { path = "modules/os/macos" }

[target.'cfg(windows)'.dependencies]
mcppls-os-windows = { path = "modules/os/windows" }

# What packaging needs, declared rather than fetched at runtime.
#
# `mcppls-devtools` drives Node (the VS Code extension is TypeScript), Rust (a Zed extension is a
# crate compiled to WebAssembly) and Gradle (the CLion plugin is a Gradle project, and xim:gradle
# brings the JDK it runs on). None of them is a library this project links, so none is a
# `[dependencies]` entry: they are tools the environment has to contain. A developer configures
# nothing -- `mcpp run -p devtools` provisions what is missing before it runs.
#
# `when = "dev"` rather than `"run"`: `run` also covers `mcpp test`, which needs none of them, and
# `dev` does not reach a consumer of this package. `version = ""` means any version.
[xlings.workspace]
"xim:node"   = { version = "", when = "dev" }
"xim:rust"   = { version = "", when = "dev" }

# Gradle is behind a feature: `[xlings.workspace]` is provisioned as a set, so an unconditional
# entry would make every `mcpp run` in this project wait for it -- or fail where the index lacks
# it. Only someone building the CLion plugin should pay for it:
#
#   mcpp run --features clion -p devtools -- extension --editor clion
[features]
clion = {}

[feature-xlings.clion]
"xim:gradle" = { version = "", when = "dev" }

# The built-in release profile (-O2, no -g), plus -s: the executables ship without their symbol
# table, 1.3 MB less per platform. Nothing in the server symbolizes its own stack, so nothing reads
# it; a crash is reproduced from a local build. Restated whole because a [profile.<built-in>]
# replaces the built-in rather than adding to it.
[profile.release]
opt   = 2
debug = false
strip = true
