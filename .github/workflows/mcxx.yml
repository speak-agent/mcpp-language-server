name: mcxx

# The mcxx engine (libmc++ in process, no clangd): build, unit tests, a clangd-free payload, and
# the linux-x64 fixtures in parallel parts. The checkout is the development layout of MC++:
# Sunrisepeak/mcpp-safe (libmc++) at the root and this fork under forks/; llvm.clang-dev comes from
# libmc++'s own index (mcpp-safe/index).

on:
  push:
    branches: [mcxx-engine]
  pull_request:
  workflow_dispatch:
    inputs:
      mcpp-safe-ref:
        description: The libmc++ (Sunrisepeak/mcpp-safe) ref to build against
        default: main

concurrency:
  group: mcxx-${{ github.ref }}
  cancel-in-progress: true

env:
  XLINGS_NON_INTERACTIVE: '1'
  XLINGS_VERSION: v2026.8.17.2
  MCPP_VERSION: 2026.9.28.2
  LLVM_VERSION: 22.1.8
  FORK: forks/mcpp-language-server

jobs:
  build:
    name: build, unit tests and payload (linux-x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - name: libmc++
        uses: actions/checkout@v4
        with:
          repository: Sunrisepeak/mcpp-safe
          ref: ${{ inputs.mcpp-safe-ref || 'main' }}
      - name: This fork
        uses: actions/checkout@v4
        with:
          path: forks/mcpp-language-server
      - name: Source rules (libmc++'s lint, over this fork)
        run: python3 tools/checks/lint.py "$FORK/src" "$FORK/modules" "$FORK/tools"
      - name: xlings
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp/registry/data/xpkgs
            ~/.mcpp/build-cache
          key: mcxx-xpkgs-${{ runner.os }}-${{ env.MCPP_VERSION }}-${{ hashFiles('**/mcpp.toml') }}
          restore-keys: mcxx-xpkgs-${{ runner.os }}-${{ env.MCPP_VERSION }}-
      - name: mcpp and LLVM
        run: bash "$FORK/.github/scripts/install-mcpp.sh"
      - name: Tools for the kit configure
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build libc6-dev linux-libc-dev
      - name: libmc++ unit tests
        run: mcpp test -p modules/graph
      - name: Build
        working-directory: ${{ env.FORK }}
        run: |
          set -euo pipefail
          mcpp build -j auto
          mcpp build -p devtools -j auto
          mkdir -p stage
          for exe in mcppls mcppls-conformance mcppls-mock-mcpp mcppls-mock-model mcppls-devtools; do
            cp "$(find target tools/devtools/target -type f -name "$exe" -path '*/bin/*' | head -1)" stage/
          done
          stage/mcppls version
      - name: Unit tests
        working-directory: ${{ env.FORK }}
        run: |
          set -euo pipefail
          mcpp test
          mcpp test --workspace
      - uses: actions/cache@v4
        with:
          path: ${{ env.FORK }}/.payload-cache
          key: payload-inputs-linux-x64-${{ hashFiles('forks/mcpp-language-server/packaging/payload.lock.json') }}
      - name: A payload without clangd
        working-directory: ${{ env.FORK }}
        run: |
          set -euo pipefail
          stage/mcppls-devtools payload --server stage/mcppls --out payload --cache .payload-cache
          stage/mcppls-devtools payload --verify payload
          test ! -e payload/clangd
          tar -czf mcxx-linux-x64.tar.gz payload stage
          du -sh payload/* mcxx-linux-x64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mcxx-linux-x64
          path: ${{ env.FORK }}/mcxx-linux-x64.tar.gz
          retention-days: 7

  conformance:
    name: conformance (linux-x64, part ${{ matrix.part }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Four parts balanced on measured times (about 150 s of fixtures each).
        include:
          - part: 1
            fixtures: clangd-cannot-load clangd-crash-context cmake-clang compdb-rejected-command diagnostic-bundle failure-at-base generated-module-old-mcpp@neovim inferred inferred-bom mcpp-emit-package-std mcpp-emit-provisioned mcpp-emit-watch@polling mcpp-gcc@plain typing-autosave typing-import typing-import-spin workaround-canaries
          - part: 2
            fixtures: compdb-mixed-standards completion-keywords inferred-cxx26 mcpp-emit-broken mcpp-emit-watch mcpp-llvm mcpp-rules-generated mcpp-split mcpp-watch mingw module-faults@zed s1-two-sets watch-polling
          - part: 3
            fixtures: build-discovery-off compdb-lto-msvc failure-at-base@vscode generated-module@vscode mcpp-emit mcpp-emit-hang mcpp-emit-needs-download mcpp-emit-partial mcpp-emit-wait mcpp-gcc mcpp-watch@polling multi-root payload-corrupt untrusted
          - part: 4
            fixtures: cmake-clang-bdb cmake-fetchcontent-offline engine-none failure-at-base@neovim generated-module generated-module-negotiated generated-module-old-mcpp mcpp-all-cppm mcpp-emit-partial-download mcpp-emit-unavailable mcpp-partition-definition mcpp-split-gcc module-faults verify-changes
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: xlings
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: ~/.mcpp/registry/data/xpkgs
          key: mcxx-fixtures-xpkgs-${{ runner.os }}-${{ env.MCPP_VERSION }}-${{ matrix.part }}
          restore-keys: mcxx-fixtures-xpkgs-${{ runner.os }}-${{ env.MCPP_VERSION }}-
      - name: mcpp and LLVM
        run: bash .github/scripts/install-mcpp.sh
      - name: Toolchains the fixtures build with
        run: |
          set -euo pipefail
          case " ${{ matrix.fixtures }} " in *" mcpp-gcc"*|*" mcpp-split-gcc "*|*" mingw "*) mcpp toolchain install gcc 16.1.0 ;; esac
          sudo apt-get update -q && sudo apt-get install -y -q ninja-build
      - name: CMake 4.4.2 (cmake-clang-bdb)
        if: contains(matrix.fixtures, 'cmake-clang-bdb')
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cmake-4.4.2"
          curl -sfL https://github.com/Kitware/CMake/releases/download/v4.4.2/cmake-4.4.2-linux-x86_64.tar.gz | tar -xz -C "$RUNNER_TEMP/cmake-4.4.2" --strip-components 1
      - uses: actions/download-artifact@v4
        with:
          name: mcxx-linux-x64
      - name: Unpack
        run: tar -xzf mcxx-linux-x64.tar.gz && ls payload stage
      - name: Run the fixtures
        run: |
          set -euo pipefail
          export CONFORMANCE_CLANGXX="$HOME/.mcpp/registry/data/xpkgs/xim-x-llvm/$LLVM_VERSION/bin/clang++"
          failed=()
          for spec in ${{ matrix.fixtures }}; do
            name=${spec%@*}; extra=()
            case "$spec" in
              watch-polling|*@polling) extra+=(--no-dynamic-watch) ;;
              *@plain) extra+=(--plain-client) ;;
              *@vscode) extra+=(--client vscode) ;;
              *@neovim) extra+=(--client neovim) ;;
              *@zed) extra+=(--client zed) ;;
            esac
            prefix=''
            [ "$name" = cmake-clang-bdb ] && prefix="$RUNNER_TEMP/cmake-4.4.2/bin:"
            echo "::group::$spec"
            if ! PATH="$prefix$PATH" stage/mcppls-conformance run --core-engine mcxx --server stage/mcppls --payload payload \
                   --fixture "conformance/fixtures/$name" --timeout 180 ${extra[@]+"${extra[@]}"}; then
              failed+=("$spec")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "::error::failed: ${failed[*]}"; exit 1; fi
      # A warm start builds no module (A1.4.4, E-LS-1): mcxx-warm cold, then again with the same
      # workspace and cache; every module file the second session sees is the one the first left.
      - name: Cold and warm start
        if: matrix.part == 1
        run: |
          set -euo pipefail
          warm="$RUNNER_TEMP/warm"
          rm -rf "$warm"
          start() {
            stage/mcppls-conformance run --core-engine mcxx --server stage/mcppls --payload payload --fixture conformance/fixtures/mcxx-warm \
                --workspace-dir "$warm/workspace" --cache-dir "$warm/cache" --timeout 180 "$@"
          }
          start
          start --expect-warm

  # ---------------------------------------------------------------------------
  # The other two platforms (M1's exit: A1.4 and A1.8 on mcppls' three). As upstream's ci.yml does,
  # one Linux host cross-builds the server -- the mcxx engine in it -- for openkal's Windows and macOS
  # targets; the unit tests are cross-built too and run on the platforms' own runners. The payloads
  # are assembled (Windows' on Linux, macOS' on a macOS host with the cross-built packaging tool) and
  # the fixtures run on the platforms themselves.
  cross-build:
    name: cross-build from Linux (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-windows-gnu, exe: '.exe', format: 'PE32+ executable' }
          - { target: aarch64-macos,      exe: '',     format: 'Mach-O 64-bit arm64' }
    defaults:
      run:
        shell: bash
    steps:
      - name: libmc++
        uses: actions/checkout@v4
        with:
          repository: Sunrisepeak/mcpp-safe
          ref: ${{ inputs.mcpp-safe-ref || 'main' }}
      - name: This fork
        uses: actions/checkout@v4
        with:
          path: forks/mcpp-language-server
      - name: xlings
        run: |
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 \
            https://raw.githubusercontent.com/openxlings/xlings/main/tools/other/quick_install.sh | bash -s "$XLINGS_VERSION"
          echo "$HOME/.xlings/subos/current/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.mcpp/registry/data/xpkgs
            ~/.mcpp/build-cache
          key: mcxx-cross-${{ matrix.target }}-${{ env.MCPP_VERSION }}-${{ hashFiles('**/mcpp.toml') }}
          restore-keys: mcxx-cross-${{ matrix.target }}-${{ env.MCPP_VERSION }}-
      - name: mcpp and LLVM
        run: bash "$FORK/.github/scripts/install-mcpp.sh"
      - name: Build for ${{ matrix.target }}
        working-directory: ${{ env.FORK }}
        run: |
          set -euo pipefail
          mcpp build -j auto --profile release --target ${{ matrix.target }}
          mcpp build -j auto -p devtools --profile release --target ${{ matrix.target }}
          mkdir -p cross
          for exe in mcppls mcppls-conformance mcppls-mock-mcpp mcppls-mock-model mcppls-devtools; do
            path=$(ls -t $(find target tools/devtools/target -type f -name "$exe${{ matrix.exe }}" -path '*/${{ matrix.target }}/*/bin/*') | head -1)
            file "$path" | tee /dev/stderr | grep -q '${{ matrix.format }}'
            cp "$path" cross/
          done
          (cd cross && sha256sum * | tee SHA256SUMS)
      # Every member's tests, cross-built: bin/<test> of each target directory's newest build.
      - name: Unit tests, built for ${{ matrix.target }}
        working-directory: ${{ env.FORK }}
        run: |
          set -euo pipefail
          mcpp test --target ${{ matrix.target }} --no-run
          mcpp test --workspace --target ${{ matrix.target }} --no-run
          mkdir -p unit
          for source in tests/*.cpp modules/*/tests/*.cpp tools/*/tests/*.cpp; do
            [ -f "$source" ] || continue
            name=$(basename "$source" .cpp)
            member=${source%/tests/*}; [ "$member" = "$source" ] || [ "$member" = tests ] && member=.
            built=$(ls -t $(find "$member/target" -type f -name "$name${{ matrix.exe }}" -path '*/${{ matrix.target }}/*/bin/*' 2>/dev/null) 2>/dev/null | head -1 || true)
            if [ -z "$built" ]; then echo "::error::$source: not built"; exit 1; fi
            mkdir -p "unit/$member" && cp "$built" "unit/$member/"
          done
          find unit -type f | sort
      - uses: actions/upload-artifact@v4
        with:
          name: mcxx-cross-${{ matrix.target }}
          path: |
            ${{ env.FORK }}/cross
            ${{ env.FORK }}/unit
          retention-days: 7

  # The cross-built tests on the platforms themselves (on Windows, not under wine: the repository
  # checks there ask git, which a Windows runner has).
  unit-cross:
    name: unit tests (${{ matrix.platform }}, cross-built)
    needs: cross-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win32-x64,    os: windows-2022, cross: x86_64-windows-gnu }
          - { platform: darwin-arm64, os: macos-14,     cross: aarch64-macos }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mcxx-cross-${{ matrix.cross }}
          path: built
      - name: Run them (on macOS signed ad hoc, as whoever ships a program adds)
        run: |
          set -euo pipefail
          failed=()
          for exe in $(find built/unit -type f | sort); do
            member=${exe#built/unit/}; member=${member%/*}; [ "$member" = "${exe#built/unit/}" ] && member=.
            chmod +x "$exe"
            if [ "$RUNNER_OS" = macOS ]; then codesign -s - -f "$exe"; fi
            echo "::group::$exe"
            if ! (cd "$member" && "$GITHUB_WORKSPACE/$exe"); then failed+=("$exe"); fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "::error::failed: ${failed[*]}"; exit 1; fi

  payload-cross:
    name: payload (${{ matrix.platform }}, mcxx)
    needs: cross-build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: win32-x64,    os: ubuntu-24.04, cross: x86_64-windows-gnu, exe: '.exe' }
          - { platform: darwin-arm64, os: macos-14,     cross: aarch64-macos,      exe: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mcpp
        if: runner.os == 'Linux'
      - name: Build tools for the kit configure
        run: |
          if [ "$RUNNER_OS" = Linux ]; then sudo apt-get update -q && sudo apt-get install -y -q ninja-build libc6-dev linux-libc-dev; fi
          if [ "$RUNNER_OS" = macOS ]; then brew install ninja; fi
          cmake --version | head -1; ninja --version
      - uses: actions/cache@v4
        with:
          path: .payload-cache
          key: payload-inputs-${{ matrix.platform }}-${{ hashFiles('packaging/payload.lock.json') }}
      - uses: actions/download-artifact@v4
        with:
          name: mcxx-cross-${{ matrix.cross }}
          path: built
      # The packaging tool has to run on THIS host: on macOS the cross-built one; a Linux runner
      # assembling the Windows payload builds its own (the cross-built one is a .exe).
      - name: The packaging tool for this host
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            mcpp build -p devtools --profile release
            cp "$(find tools/devtools/target -type f -name mcppls-devtools -path '*/bin/*' -newer mcpp.toml | head -1)" host-devtools
          else
            cp built/cross/mcppls-devtools host-devtools
          fi
          chmod +x host-devtools built/cross/*
          if [ "$RUNNER_OS" = macOS ]; then for f in host-devtools built/cross/*; do [ "${f##*/}" = SHA256SUMS ] || codesign -s - -f "$f"; done; fi
      - name: Assemble (the server's own engine; no clangd)
        run: |
          set -euo pipefail
          ./host-devtools payload --platform ${{ matrix.platform }} --server "built/cross/mcppls${{ matrix.exe }}" --out payload --cache .payload-cache
          ./host-devtools payload --verify payload
          test ! -e payload/clangd
          mkdir -p stage && cp built/cross/* stage/
          tar -czf mcxx-${{ matrix.platform }}.tar.gz payload stage
          du -sh payload/* mcxx-${{ matrix.platform }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: mcxx-${{ matrix.platform }}
          path: mcxx-${{ matrix.platform }}.tar.gz
          retention-days: 7

  # The fixtures upstream runs on these platforms, less the ones for MSVC's toolchain and for
  # clangd's own failures, with the mcxx engine: the server the payload carries, its engine in it.
  conformance-cross:
    name: conformance (${{ matrix.platform }}, mcxx)
    needs: payload-cross
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
            fixtures: inferred inferred-bom build-discovery-off engine-none module-faults untrusted mcpp-llvm mcpp-split mcpp-partition-definition mcpp-all-cppm verify-changes mcpp-watch multi-root failure-at-base failure-at-base@zed generated-module generated-module-old-mcpp generated-module-negotiated typing-import typing-import-spin workaround-canaries completion-keywords diagnostic-bundle typing-autosave mcpp-emit-wait inferred-cxx26
          - platform: win32-x64
            os: windows-2022
            fixtures: inferred inferred-bom build-discovery-off engine-none module-faults untrusted mcpp-split mcpp-partition-definition mcpp-all-cppm verify-changes multi-root mingw mcpp-watch failure-at-base failure-at-base@vscode typing-import typing-import-spin workaround-canaries typing-autosave completion-keywords diagnostic-bundle mcpp-emit-hang mcpp-emit-wait inferred-cxx26
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-mcpp
      - name: Toolchains the fixtures build with
        run: |
          set -euo pipefail
          case " ${{ matrix.fixtures }} " in *" mingw "*) mcpp toolchain install gcc 16.1.0 ;; esac
      - uses: actions/download-artifact@v4
        with:
          name: mcxx-${{ matrix.platform }}
      - name: Unpack
        run: |
          tar -xzf mcxx-${{ matrix.platform }}.tar.gz && ls payload stage
          if [ "$RUNNER_OS" = macOS ]; then for f in stage/* payload/bin/*; do [ -f "$f" ] && [ -x "$f" ] && codesign -s - -f "$f" || true; done; fi
      - name: Run the fixtures
        run: |
          set -euo pipefail
          exe=''; [ "$RUNNER_OS" = Windows ] && exe='.exe'
          failed=()
          for spec in ${{ matrix.fixtures }}; do
            name=${spec%@*}; extra=()
            case "$spec" in
              *@vscode) extra+=(--client vscode) ;;
              *@neovim) extra+=(--client neovim) ;;
              *@zed) extra+=(--client zed) ;;
            esac
            echo "::group::$spec"
            if ! "stage/mcppls-conformance$exe" run --core-engine mcxx --server "payload/bin/mcppls$exe" --payload payload \
                   --fixture "conformance/fixtures/$name" --timeout 180 ${extra[@]+"${extra[@]}"}; then
              failed+=("$spec")
            fi
            echo "::endgroup::"
          done
          if [ ${#failed[@]} -gt 0 ]; then echo "::error::failed: ${failed[*]}"; exit 1; fi
      # A warm start builds no module (A1.4.4) on this platform too.
      - name: Cold and warm start
        run: |
          set -euo pipefail
          exe=''; [ "$RUNNER_OS" = Windows ] && exe='.exe'
          warm="$RUNNER_TEMP/warm"
          start() {
            "stage/mcppls-conformance$exe" run --core-engine mcxx --server "payload/bin/mcppls$exe" --payload payload --fixture conformance/fixtures/mcxx-warm \
                --workspace-dir "$warm/workspace" --cache-dir "$warm/cache" --timeout 180 "$@"
          }
          start
          start --expect-warm
